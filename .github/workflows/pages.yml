name: Launch the public simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the towel before launch
        run: npm run check && npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload simulator assets only
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the simulator
        id: deployment
        uses: actions/deploy-pages@v4
